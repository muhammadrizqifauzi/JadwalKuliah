<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jadwal Kuliah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container-jadwal">
    <h2>Jadwal Kuliah</h2>

    <table class="table-jadwal">
        <tr class="bg-grey">
            <th>Waktu</th>
            <th>Senin</th>
            <th>Selasa</th>
            <th>Rabu</th>
            <th>Kamis</th>
        </tr>
        <tr>
            <td>08:00 - 09:30</td>
            <td class="bg-senin">Matematika Diskrit</td>
            <td class="bg-selasa">Algoritma</td>
            <td rowspan="2" class="bg-rabu">Sistem Operasi</td>
            <td class="bg-kamis">Bahasa Inggris</td>
        </tr>
        <tr>
            <td>09:30 - 11:00</td>
            <td class="bg-senin">Jaringan Komputer</td>
            <td class="bg-selasa">Kalkulus</td>
            <td class="bg-kamis">Web Programming</td>
        </tr>
        <tr>
            <td>11:00 - 12:30</td>
            <td colspan="2" class="bg-senin">Proyek Akhir</td>
            <td class="bg-rabu">Mobile Programming</td>
            <td rowspan="2" class="bg-kamis">AI</td>
        </tr>
        <tr>
            <td>13:00 - 14:30</td>
            <td class="bg-senin">Basis Data</td>
            <td class="bg-selasa">Arsitektur Komputer</td>
            <td class="bg-rabu">Keamanan Siber</td>
        </tr>
        <tr class="bg-grey">
            <td colspan="5">ISTIRAHAT</td>
        </tr>
    </table>
</div>

</body>
</html>
